name: Build and publish Kayla Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kays-Photo-Magic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kays-Photo-Magic-debug-APK
          path: Kays-Photo-Magic.apk
      - name: Publish and verify direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s Kays-Photo-Magic.apk
          if gh release view kayla-latest >/dev/null 2>&1; then
            gh release upload kayla-latest ./Kays-Photo-Magic.apk --clobber
          else
            gh release create kayla-latest ./Kays-Photo-Magic.apk --title "Kayla AI - Latest Android APK" --notes "Download Kays-Photo-Magic.apk from Assets to install Kayla on Android." --latest
          fi
          gh release view kayla-latest --json assets --jq '.assets[].name' | grep -Fx 'Kays-Photo-Magic.apk'
